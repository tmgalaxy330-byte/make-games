<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#5c96fa">
<title>ミスターポストマン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="pill" id="hearts"><span class="heart"></span><span class="heart"></span><span class="heart"></span></div>
  <div class="pill"><canvas id="stamp-icon" width="13" height="13"></canvas><b id="stamps">× 0</b></div>
  <div class="pill"><small>のこり</small><b id="lives">× 3</b></div>
  <div class="pill" hidden><canvas id="item-icons" width="34" height="16"></canvas></div>
  <div class="spacer"></div>
  <div class="pill"><small>WORLD</small><b id="world-label">1-1</b></div>
  <button class="pill icon" id="btn-pause" aria-label="一時停止"><i></i><i></i></button>
</div>

<div id="pad">
  <div class="btn arrow" id="btn-left" data-key="left">◀</div>
  <div class="btn arrow" id="btn-right" data-key="right">▶</div>
  <div class="btn dash" id="btn-dash" data-key="dash">DASH</div>
  <div class="btn jump" id="btn-jump" data-key="jump">JUMP</div>
  <div class="btn throw" id="btn-throw" data-key="throw" hidden>FIRE</div>
</div>

<div class="overlay" id="pause-menu" hidden>
  <div class="panel">
    <h2>PAUSE</h2>
    <button id="btn-resume">RESUME</button>
    <div class="row">
      <button id="btn-restart" class="sub">RETRY</button>
      <button id="btn-pause-map" class="sub">MAP</button>
    </div>
  </div>
</div>

<div class="overlay" id="clear-menu" hidden>
  <div class="panel">
    <div class="result"><canvas id="clear-stamp-icon" width="13" height="13"></canvas><b>×</b><b id="clear-stamps">0</b></div>
    <div class="row">
      <button id="btn-replay" class="sub">REPLAY</button>
      <button id="btn-next">NEXT</button>
    </div>
  </div>
</div>

<div class="overlay" id="over-menu" hidden>
  <div class="panel">
    <h2>GAME OVER</h2>
    <p>もういちど配達にちょうせんしよう！</p>
    <div class="row">
      <button id="btn-over-map" class="sub">MAP</button>
      <button id="btn-over">RETRY</button>
    </div>
  </div>
</div>

<!-- タイトル -->
<div class="scene" id="title-screen" hidden>
  <div class="title-wrap">
    <canvas id="title-hero" width="20" height="23"></canvas>
    <h1 class="logo"><span class="logo-en">MISTER</span><span class="logo-en big">POSTMAN</span><span class="logo-ja">ミスターポストマン</span></h1>
    <div class="title-buttons">
      <button id="btn-continue" hidden>CONTINUE</button>
      <button id="btn-start">START</button>
    </div>
  </div>
  <div class="overlay" id="confirm-new" hidden>
    <div class="panel">
      <p>セーブを消して、はじめからにする？</p>
      <div class="row">
        <button id="btn-new-no" class="sub">NO</button>
        <button id="btn-new-yes" class="danger">YES</button>
      </div>
    </div>
  </div>
</div>

<!-- ステージ選択 -->
<div class="scene" id="map-screen" hidden>
  <div class="map-head"><small>WORLD 1</small><b>はじまりの草原島</b></div>
  <div class="map-track">
    <div class="map-line"></div>
    <div class="map-nodes" id="map-nodes"></div>
    <canvas id="map-hero" width="20" height="23"></canvas>
  </div>
  <div class="map-foot">
    <button id="btn-title" class="sub">TITLE</button>
    <button id="btn-play">PLAY</button>
  </div>
</div>

<!-- 会話 -->
<div class="scene" id="dialog" hidden>
  <button id="btn-skip" class="skip">SKIP ▶▶</button>
  <div class="dialog-box" id="dialog-box">
    <canvas id="dialog-face" width="20" height="23"></canvas>
    <div class="dialog-body">
      <div class="dialog-name" id="dialog-name"></div>
      <div class="dialog-text" id="dialog-text"></div>
    </div>
    <div class="dialog-next" id="dialog-next">▼</div>
  </div>
</div>

<div class="overlay" id="rotate">
  <div class="panel">
    <div class="phone"></div>
    <h2>スマホを横にしてね</h2>
  </div>
</div>

<script src="sprites.js"></script>
<script src="main.js"></script>
</body>
</html>
